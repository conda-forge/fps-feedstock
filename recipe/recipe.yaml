schema_version: 1

context:
  version: "0.6.6"

package:
  name: fps
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps/fps-${{ version }}.tar.gz
    sha256: 5e79468e03fd9da182cf3e29cc8093d1054a1725dd8439f458813f169fc09a21

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - fps = fps.cli._cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anyio >=4.14.0,<5.0.0
    - structlog
    - exceptiongroup

tests:
  - python:
      imports: fps
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A system for creating modular, configurable, pluggable and concurrent applications.
  repository: https://github.com/jupyter-server/fps
  homepage: https://jupyter-server.github.io/fps
  license_file: LICENSE
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - adriendelsalle
    - davidbrochart
